# STACKIT SA key for the cert-manager DNS-01 webhook (DNS-01 because
# the LB is IP-locked, so HTTP-01 cannot reach it). The webhook chart expects a secret
# `stackit-sa-authentication` with key `sa.json` in the cert-manager namespace.
#
# Operator-seeded SM entry `stackit-dns-sa-key` must hold {"sa.json": "<SA key JSON>"}
# for a STACKIT SA with DNS write permission. Synced here, not committed (no key in Git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-stackit-sa-authentication
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: stackit-sa-authentication
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: stackit-dns-sa-key
