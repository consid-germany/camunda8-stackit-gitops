# ExternalSecrets for the PROD cluster (OpenSearch secondary storage).
# All resolve against the foundation-provisioned ClusterSecretStore `secrets-prod`.
#
# SM entry -> k8s Secret:
#   entra-credentials                          -> entra-credentials
#   postgres-prod-identity-user-credentials    -> postgres-identity-credentials
#   postgres-prod-webmodeler-user-credentials  -> postgres-webmodeler-credentials
#   opensearch-credentials                     -> opensearch-credentials (OpenSearch only; key: password)
#   zeebe-backup-credentials                   -> zeebe-backup-credentials (foundation-written)
#   opensearch-backup-credentials              -> opensearch-backup-credentials (foundation-written; OpenSearch only)
#   platform-connection-config                 -> platform-connection-config (foundation-written)
#   camunda-connector-secrets-prod             -> connector-secrets (keys rewritten to SECRET_*)
#   web-modeler-pusher-credentials             -> web-modeler-pusher-credentials (foundation-written)
#
# NOTE: the SM entry name comes from modules/stackit-opensearch (locals:
# credentials_kv_secret = "opensearch-credentials" — no env suffix; each env has its
# own SM instance, so the name needs no scoping). Adjust both together if it changes.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-entra-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: entra-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  # Only the keys camunda pods consume. ArgoCD/Grafana pull their own
  # keys into their own namespaces; Web Modeler UI is PKCE (no secret).
  data:
    - secretKey: identity-client-secret
      remoteRef:
        key: entra-credentials
        property: identity-client-secret
    - secretKey: optimize-client-secret
      remoteRef:
        key: entra-credentials
        property: optimize-client-secret
    - secretKey: orchestration-cluster-client-secret
      remoteRef:
        key: entra-credentials
        property: orchestration-cluster-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-postgres-identity-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: postgres-identity-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: postgres-prod-identity-user-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-postgres-webmodeler-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: postgres-webmodeler-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: postgres-prod-webmodeler-user-credentials
---
# OpenSearch secondary storage only. Produces secret key `password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-opensearch-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: opensearch-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        # Must match modules/stackit-opensearch locals.credentials_kv_secret.
        key: opensearch-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-zeebe-backup-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: zeebe-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: zeebe-backup-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-opensearch-backup-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: opensearch-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: opensearch-backup-credentials
---
# Dynamic connection coordinates written by the foundation. Provides
# POSTGRES_HOST/PORT, IDENTITY_DATABASE_URL, WEBMODELER_DATABASE_URL,
# OPENSEARCH_URL (opensearch). Consumed via env valueFrom in the Camunda values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-platform-connection-config
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: platform-connection-config
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: platform-connection-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-connector-secrets
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: connector-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: camunda-connector-secrets-prod
      rewrite:
        - regexp:
            source: "(.*)"
            target: "SECRET_$1"
---
# Web Modeler's internal Pusher app secret + key, shared by restapi and websockets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-web-modeler-pusher-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-prod
    kind: ClusterSecretStore
  target:
    name: web-modeler-pusher-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: web-modeler-pusher-credentials
