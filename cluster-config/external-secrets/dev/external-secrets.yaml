# ExternalSecrets for the DEV cluster (RDBMS secondary storage).
# All resolve against the foundation-provisioned ClusterSecretStore `secrets-dev`.
# Each ExternalSecret materialises a Kubernetes Secret in the `camunda` namespace.
#
# SM entry -> k8s Secret:
#   entra-credentials                     -> entra-credentials
#   postgres-dev-identity-user-credentials   -> postgres-identity-credentials
#   postgres-dev-webmodeler-user-credentials -> postgres-webmodeler-credentials
#   postgres-dev-operate-user-credentials    -> postgres-operate-credentials (RDBMS only)
#   zeebe-backup-credentials              -> zeebe-backup-credentials (foundation-written)
#   platform-connection-config            -> platform-connection-config (foundation-written)
#   camunda-connector-secrets-dev         -> connector-secrets (keys rewritten to SECRET_*)
#   web-modeler-pusher-credentials        -> web-modeler-pusher-credentials (foundation-written)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-entra-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: entra-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  # Only the keys camunda pods consume. ArgoCD/Grafana pull their own
  # keys into their own namespaces; Web Modeler UI is PKCE (no secret).
  data:
    - secretKey: identity-client-secret
      remoteRef:
        key: entra-credentials
        property: identity-client-secret
    - secretKey: optimize-client-secret
      remoteRef:
        key: entra-credentials
        property: optimize-client-secret
    - secretKey: orchestration-cluster-client-secret
      remoteRef:
        key: entra-credentials
        property: orchestration-cluster-client-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-postgres-identity-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: postgres-identity-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: postgres-dev-identity-user-credentials
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-postgres-webmodeler-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: postgres-webmodeler-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: postgres-dev-webmodeler-user-credentials
---
# RDBMS secondary storage only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-postgres-operate-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: postgres-operate-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: postgres-dev-operate-user-credentials
---
# Zeebe S3 backup config (ZEEBE_* keys, consumed via envFrom by orchestration).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-zeebe-backup-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: zeebe-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: zeebe-backup-credentials
---
# Dynamic connection coordinates written by the foundation. Provides
# POSTGRES_HOST/PORT, IDENTITY_DATABASE_URL, WEBMODELER_DATABASE_URL,
# OPERATE_DATABASE_URL (rdbms). Consumed via env valueFrom in the Camunda values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-platform-connection-config
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: platform-connection-config
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: platform-connection-config
---
# Connector secrets: every key in the SM entry is synced as SECRET_<key>.
# {{secrets.my-key}} in BPMN resolves to SECRET_my-key. Adding a key in SM takes
# effect on the next refresh with no GitOps change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-connector-secrets
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: connector-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: camunda-connector-secrets-dev
      rewrite:
        - regexp:
            source: "(.*)"
            target: "SECRET_$1"
---
# Web Modeler's internal Pusher app secret + key, shared by restapi and websockets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-web-modeler-pusher-credentials
  namespace: camunda
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secrets-dev
    kind: ClusterSecretStore
  target:
    name: web-modeler-pusher-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: web-modeler-pusher-credentials
