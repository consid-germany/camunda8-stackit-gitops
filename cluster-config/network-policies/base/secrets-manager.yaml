# --- secrets-manager namespace NetworkPolicies ---
# This namespace holds only the secretsmanager-token Secret (ESO's credential),
# no pods. ESO reads it via the apiserver, which NetworkPolicies do not touch, so
# an unconditional default-deny in both directions is safe and final.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: secrets-manager
spec:
  podSelector: {}
  policyTypes:
    - Egress
