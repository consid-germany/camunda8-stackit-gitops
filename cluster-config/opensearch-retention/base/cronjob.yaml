# Retention fallback: native ISM retention is unavailable to the app credential (403),
# but plain index delete is index-level and works (verified against a disposable
# dated-format index). Deletes dated operate-*/tasklist-*/zeebe-record_* archive indices
# only -- never the live (undated, trailing "_") schema indices, never camunda-*.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opensearch-retention
  labels:
    app.kubernetes.io/name: opensearch-retention
    app.kubernetes.io/component: retention
spec:
  schedule: "0 12 * * 1-5"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: opensearch-retention
            app.kubernetes.io/component: retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retention
              image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: opensearch-retention-config
                - secretRef:
                    name: platform-connection-config # OPENSEARCH_URL, OPENSEARCH_USERNAME
              env:
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-credentials
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  CUTOFF=$(( $(date +%s) - ${INDEX_RETENTION_DAYS:-60} * 86400 ))
                  DELETED=0
                  for index in $(curl -fsS -u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" \
                      "${OPENSEARCH_URL}/_cat/indices?h=index" \
                      | grep -E '^(operate-|tasklist-|zeebe-record_).*_[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true); do
                    date_suffix=$(printf '%s' "$index" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$')
                    index_epoch=$(date -d "${date_suffix}" +%s)
                    if [ "$index_epoch" -lt "$CUTOFF" ]; then
                      curl -fsS -u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" -X DELETE "${OPENSEARCH_URL}/${index}"
                      echo "deleted ${index} (dated ${date_suffix})"
                      DELETED=$((DELETED + 1))
                    fi
                  done
                  echo "cleanup complete: ${DELETED} index(es) deleted, cutoff epoch ${CUTOFF}"
