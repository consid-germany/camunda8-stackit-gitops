# PROD Camunda backup at noon UTC -- the hour most likely to fall inside a working session,
# since the cluster stops at 20:00 and is woken by hand (see dev/kustomization.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: camunda
resources:
  - ../base
patches:
  - target:
      kind: CronJob
      name: camunda-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 12 * * *"
configMapGenerator:
  - name: camunda-backup-config
    literals:
      - MGMT_BASE_URL=http://prod-camunda-zeebe-gateway:9600
      - OPTIMIZE_MANAGEMENT_API=http://prod-camunda-optimize:8092
      - BACKUP_RETENTION_DAYS=7
