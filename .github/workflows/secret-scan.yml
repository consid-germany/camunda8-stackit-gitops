# Gitleaks over the full working tree on every PR. Deliberately unfiltered:
# a credential can land in any file, so no `paths:` gate (render-test has one).
name: secret-scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan working tree
        run: gitleaks dir . --no-banner --redact
