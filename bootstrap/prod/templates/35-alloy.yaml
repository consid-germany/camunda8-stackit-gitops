# Wave 2: Grafana Alloy (Helm, DaemonSet). Ships node/pod logs to Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-prod
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        valueFiles:
          - $values/platform/alloy/values.yaml
    - repoURL: https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
      targetRevision: {{ .Values.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
