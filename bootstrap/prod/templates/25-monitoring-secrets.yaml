# Wave 1: Grafana Entra client-secret ExternalSecret in the monitoring namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-monitoring-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: camunda-prod
  source:
    repoURL: https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
    targetRevision: {{ .Values.targetRevision | quote }}
    path: cluster-config/external-secrets/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # ESO's CRD defaults these no-op strategy fields in; without ignoring them the app never
  # reaches Synced. deletionPolicy is declared in the manifests instead, to stay diffable.
  # An ignored path that changes in git will not auto-apply -- remove it from here first.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.data[]?.remoteRef.conversionStrategy
        - .spec.data[]?.remoteRef.decodingStrategy
        - .spec.data[]?.remoteRef.metadataPolicy
        - .spec.dataFrom[]?.extract.conversionStrategy
        - .spec.dataFrom[]?.extract.decodingStrategy
        - .spec.dataFrom[]?.extract.metadataPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
