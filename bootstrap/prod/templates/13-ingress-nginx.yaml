# Wave 0: ingress-nginx (Helm). externalTrafficPolicy=Local, TLS/HSTS hardening.
# Office-CIDR gate at both layers: L4 loadBalancerSourceRanges (coarse, provider-enforced)
# plus L7 whitelist-source-range via PROXY protocol (per-host rules L4 cannot express).
# office-cidr-values.yaml holds the CIDR for both envs, prod-values.yaml the rest.
# Dropping either valueFile leaves every ingress open -- tests/policy asserts the gate renders.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-prod
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      # Last release ever: the project retired March 2026.
      targetRevision: 4.15.1
      helm:
        valueFiles:
          - $values/platform/ingress-nginx/office-cidr-values.yaml
          - $values/platform/ingress-nginx/prod-values.yaml
    - repoURL: https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
      targetRevision: {{ .Values.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
