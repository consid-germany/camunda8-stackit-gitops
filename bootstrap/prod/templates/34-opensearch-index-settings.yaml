# Wave 3: the legacy exporter has no refresh_interval setting, so its zeebe-record_*
# indices are put on the interval out-of-band. Prod only -- dev runs no OpenSearch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-opensearch-index-settings
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: camunda-prod
  source:
    repoURL: https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
    targetRevision: {{ .Values.targetRevision | quote }}
    path: cluster-config/opensearch-index-settings/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: camunda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
