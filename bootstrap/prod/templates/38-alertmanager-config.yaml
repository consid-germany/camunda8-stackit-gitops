# Wave 3: Alertmanager's top-level routing. After kube-prometheus-stack (wave 2), which
# installs the AlertmanagerConfig CRD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-alertmanager-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: camunda-prod
  source:
    repoURL: https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
    targetRevision: {{ .Values.targetRevision | quote }}
    path: cluster-config/alertmanager/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
