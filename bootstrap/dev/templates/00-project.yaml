# AppProjects for the DEV cluster. Two, split by privilege, not by component:
# every Application that needs a cluster-scoped resource lives in platform-dev,
# everything else in camunda-dev, which may not create cluster-scoped objects at all.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-dev
  namespace: argocd
  # Ahead of every child Application: an Application whose project does not yet
  # exist errors until the next reconcile.
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  # Keep the project until its Applications are removed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster-privileged platform charts (dev) - CRDs, cluster RBAC, webhooks.
  sourceRepos:
    - https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
    - https://charts.jetstack.io
    - https://stackitcloud.github.io/stackit-cert-manager-webhook
    - https://kubernetes.github.io/ingress-nginx
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: monitoring
    # cert-manager + the DNS-01 webhook place leader-election / extension-apiserver
    # RBAC (Role/RoleBinding/Lease) in kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system
    # Cluster-scoped Applications declare an empty destination namespace.
    - server: https://kubernetes.default.svc
      namespace: ""
  # Cluster-scoped resources these charts legitimately manage.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
    - group: apiregistration.k8s.io
      kind: APIService
  # Enumerated from what these charts render today. A new kind is a deliberate
  # addition here; the symptom otherwise is a sync error naming the kind.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: DaemonSet
    - group: apps
      kind: Deployment
    # Helm hooks: cert-manager's startupapicheck and the prometheus-operator
    # admission-webhook patch. Rendered, but not in Application.status.resources.
    - group: batch
      kind: Job
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer
    - group: monitoring.coreos.com
      kind: Alertmanager
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: ServiceMonitor
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: camunda-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Camunda 8.9 platform (dev) - namespaced workloads synced by ArgoCD.
  sourceRepos:
    - https://github.com/REPLACE_ME-github-org/camunda8-stackit-gitops.git
    - https://helm.camunda.io
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: camunda
    - server: https://kubernetes.default.svc
      namespace: monitoring
    # NetworkPolicies for the foundation-managed namespaces.
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: external-secrets-system
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: secrets-manager
    # The NetworkPolicy apps span namespaces, so they declare no destination namespace
    # and ArgoCD checks that against this list. Cluster-scoped kinds stay denied below.
    - server: https://kubernetes.default.svc
      namespace: ""
  # No clusterResourceWhitelist: an empty list denies every cluster-scoped kind.
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: CronJob
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: external-secrets.io
      kind: ExternalSecret
    - group: monitoring.coreos.com
      kind: AlertmanagerConfig
    - group: monitoring.coreos.com
      kind: ServiceMonitor
