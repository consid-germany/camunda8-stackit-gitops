# Wave 0: STACKIT cert-manager DNS-01 webhook (Helm). Provides the dns01 solver
# the ClusterIssuers reference. Needs a `stackit-sa-authentication` Secret
# (key sa.json) in the cert-manager namespace -- the STACKIT SA key used to write
# ACME TXT records. That secret is expected to be present in the cluster
# (foundation-provided, or add an ExternalSecret for it). See README.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-stackit-cert-manager-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-dev
  source:
    repoURL: https://stackitcloud.github.io/stackit-cert-manager-webhook
    chart: stackit-cert-manager-webhook
    targetRevision: 0.4.8
    helm:
      parameters:
        - name: stackitSaAuthentication.enabled
          value: "true"
      valuesObject:
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 100m, memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
