# Grafana Alloy Helm values. DaemonSet; ships node/pod logs to the in-cluster Loki.
# Replaces Promtail, which reached end of life 2026-03-02.

alloy:
  # Alloy reads log files from its own node, so it needs the node name to filter
  # the discovery output down to local pods.
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  mounts:
    varlog: true
    # storagePath defaults to /tmp/alloy, which readOnlyRootFilesystem makes unwritable.
    extra:
      - name: tmp
        mountPath: /tmp
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  configMap:
    content: |
      // Pod discovery. The DaemonSet reads log files from its own node, so the target
      // list is filtered to this node before anything else.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("NODE_NAME")
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }

        // Matches the kubelet layout: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // The kubelet writes CRI-format lines; stage.cri splits off timestamp and stream.
      loki.process "pod_logs" {
        stage.cri {}

        forward_to = [loki.write.default.receiver]
      }

      // Release-prefixed Service name; a bare `loki` does not exist.
      loki.write "default" {
        endpoint {
          url = "http://prod-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  volumes:
    extra:
      - name: tmp
        emptyDir: {}

# Replaces the chart's default rule list wholesale (Helm swaps lists, it does not merge).
# The default also grants cluster-wide secrets and configmaps, which least-privilege RBAC forbids and
# log shipping never reads; discovery.kubernetes with role="pod" needs only pods.
rbac:
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]

# Chart default carries requests but no memory limit. 50m CPU sat at ~24%
# throttling, just under the alert threshold.
configReloader:
  resources:
    requests: {cpu: 10m, memory: 50Mi}
    limits: {cpu: 100m, memory: 96Mi}

# Scraped for the log-ingestion alert; alloy already runs in the monitoring namespace.
serviceMonitor:
  enabled: true
