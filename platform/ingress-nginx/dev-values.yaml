# ingress-nginx Helm values -- DEV.
#
# Office-CIDR ingress gate via yawol PROXY protocol: the LB
# prepends the real client IP (tcpProxyProtocol), nginx parses and trusts it
# (use-proxy-protocol + proxy-real-ip-cidr), and whitelist-source-range gates every ingress
# to the office CIDR. The webhook door overrides to 0.0.0.0/0 per-ingress (HMAC is its gate).
# L7 keeps per-host granularity that L4 loadBalancerSourceRanges cannot: it is whole-LB.
# Validated on dev 2026-07-29: nginx access log shows the real office source IP.
#
# ⚠️ OUTAGE RISK: tcpProxyProtocol (LB) and use-proxy-protocol (nginx) MUST move together.
# If nginx can't parse or trust the header it sees the LB's 10.250.x.x and 403s EVERYONE
# (webhook door stays open). Failure signature: office clients get 403. Rollback = revert file.
# TLS hardening: TLS 1.2/1.3 + HSTS (SEC-29).
controller:
  # ingress-nginx provisions its admission-webhook cert via Helm-hook certgen Jobs, which loop
  # forever under ArgoCD (hook-delete-policy deletes the Job before Argo records success, so it
  # recreates it every reconcile and the sync never applies the controller). Disable the
  # admission webhook -- Ingresses come via GitOps PR review, so in-cluster validation adds
  # little. To keep validation, set admissionWebhooks.certManager.enabled=true instead
  # (cert-manager issues the cert, no hook Jobs).
  admissionWebhooks:
    enabled: false
  service:
    externalTrafficPolicy: Local
    annotations:
      # Make yawol pass the real client IP via PROXY protocol instead of SNATing it away.
      yawol.stackit.cloud/tcpProxyProtocol: "true"
      yawol.stackit.cloud/tcpProxyProtocolPortsFilter: "80,443"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  config:
    ssl-protocols: "TLSv1.2 TLSv1.3"
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    # Default 1000 recycles HTTP/2 connections mid-stream (GOAWAY), killing zeebe
    # gRPC job streams; pushed jobs then sit locked until job timeout.
    keep-alive-requests: "10000"
    # A zeebe client multiplexes all workers + job streams over one channel; default 128.
    http2-max-concurrent-streams: "512"
    # Parse + trust the PROXY-protocol header from the yawol LB.
    use-proxy-protocol: "true"
    # In-cluster range nginx sees the LB connect FROM. Verified live 2026-08-11:
    # nodes 10.250.3.x, LB 10.250.2.x. If wrong, the whitelist blocks everyone.
    proxy-real-ip-cidr: "10.250.0.0/16"
    # The gate itself (whitelist-source-range) is in office-cidr-values.yaml, merged ahead
    # of this file. The webhook door overrides it per-ingress.
