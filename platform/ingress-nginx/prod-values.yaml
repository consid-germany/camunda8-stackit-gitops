# ingress-nginx Helm values -- PROD.
#
# Office-CIDR ingress gate via yawol PROXY protocol, promoted
# from dev after live validation 2026-07-29 (real client IP in the access log, out-of-range
# clients 403). The LB prepends the real client IP (tcpProxyProtocol), nginx parses and
# trusts it (use-proxy-protocol + proxy-real-ip-cidr), whitelist-source-range gates every
# ingress to the office CIDR. The webhook door overrides to 0.0.0.0/0 per-ingress (HMAC is
# its gate).
#
# ⚠️ OUTAGE RISK: tcpProxyProtocol (LB) and use-proxy-protocol (nginx) MUST move together.
# If nginx can't parse or trust the header it sees the LB's 10.250.x.x and 403s EVERYONE
# (webhook door stays open). Failure signature: office clients get 403. Rollback = revert file.
# Expect a brief connection blip while the LB listeners and nginx reload converge on merge.
# TLS hardening: TLS 1.2/1.3 + HSTS (SEC-29).
controller:
  # See dev-values.yaml: the admission-webhook certgen Helm-hook Jobs loop under ArgoCD.
  # Disabled for consistency. To keep validation, use admissionWebhooks.certManager.enabled=true.
  admissionWebhooks:
    enabled: false
  # 2 replicas: with externalTrafficPolicy=Local, a single controller pod means losing
  # its node drops ALL platform traffic. Two replicas on distinct nodes is the floor.
  replicaCount: 2
  # Enforces the "distinct nodes" above; without it both replicas can share one node.
  # DoNotSchedule is safe: 3 nodes, 2 replicas +1 surge.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/instance: prod-ingress-nginx
          app.kubernetes.io/component: controller
  service:
    externalTrafficPolicy: Local
    annotations:
      # Make yawol pass the real client IP via PROXY protocol instead of SNATing it away.
      yawol.stackit.cloud/tcpProxyProtocol: "true"
      yawol.stackit.cloud/tcpProxyProtocolPortsFilter: "80,443"
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # Without this the IngressHighErrorRate alert has no metric and can never fire.
  # ServiceMonitor lives in monitoring: the operator's watch scope excludes this namespace.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      scrapeInterval: 30s
  config:
    ssl-protocols: "TLSv1.2 TLSv1.3"
    hsts: "true"
    hsts-max-age: "31536000"
    hsts-include-subdomains: "true"
    # Default 1000 recycles HTTP/2 connections mid-stream (GOAWAY), killing zeebe
    # gRPC job streams; pushed jobs then sit locked until job timeout.
    keep-alive-requests: "10000"
    # A zeebe client multiplexes all workers + job streams over one channel; default 128.
    http2-max-concurrent-streams: "512"
    # Parse + trust the PROXY-protocol header from the yawol LB (prod nodes are 10.250.x.x too).
    use-proxy-protocol: "true"
    proxy-real-ip-cidr: "10.250.0.0/16"
    # The gate itself (whitelist-source-range) is in office-cidr-values.yaml, merged ahead
    # of this file. The webhook door overrides it per-ingress.
